<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php index.html

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    # Match the original URL so PHP rewrites retain the admin cache policy.
    Header onsuccess unset Cache-Control "expr=%{THE_REQUEST} =~ m#^[^ ]+ /+admin(?:[/? ]|$)#"
    Header always set Cache-Control "no-cache, max-age=0, must-revalidate" "expr=%{THE_REQUEST} =~ m#^[^ ]+ /+admin(?:[/? ]|$)#"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

ServerTokens Prod
ServerSignature Off
