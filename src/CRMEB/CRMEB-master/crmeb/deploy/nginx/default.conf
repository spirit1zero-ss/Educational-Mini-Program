server {
    listen 80;
    index index.php index.html;
    server_name bz.crmeb.com;
    client_max_body_size 100M;

    root /var/www/public;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml;

    location ^~ /install {
        return 404;
    }

    location ^~ /admin_backup {
        return 404;
    }

    location ^~ /outapi {
        return 404;
    }

    location = /mobile.html {
        return 404;
    }

    location ^~ /pages/activity {
        return 404;
    }

    location ^~ /pages/columnGoods {
        return 404;
    }

    location ^~ /pages/goods {
        return 404;
    }

    location ^~ /pages/points_mall {
        return 404;
    }

    location ^~ /pages/users {
        return 404;
    }

    location = /admin/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /admin/index.html =404;
    }

    location = /admin/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /admin/index.html =404;
    }

    location ^~ /admin/system_static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        error_log off;
        try_files $uri =404;
    }

    location / {
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?s=$1 last;
            break;
        }
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ {
        expires 30d;
        error_log off;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$ {
        expires 12h;
        error_log off;
        access_log /dev/null;
    }

    location /notice {
        proxy_pass http://192.168.10.90:40001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-real-ip $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /msg {
        proxy_pass http://192.168.10.90:40002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-real-ip $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass phpfpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
